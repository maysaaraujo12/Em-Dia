<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Em Dia - Gestão de Tarefas</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04)',
            'card-hover': '0 8px 20px -4px rgba(15, 23, 42, 0.14), 0 4px 8px -2px rgba(15, 23, 42, 0.06)',
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Estilização personalizada para barras de rolagem suaves e feedback de Drag & Drop */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Scrollbar horizontal do quadro Kanban */
    .board-scroll::-webkit-scrollbar {
      height: 10px;
    }
    .board-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .board-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }
    .board-scroll::-webkit-scrollbar-thumb:hover {
      background-color: rgba(148, 163, 184, 0.7);
    }

    /* Scrollbar vertical interna das colunas */
    .column-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .column-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .column-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }

    /* Estados visuais de Drag and Drop */
    .card-dragging {
      opacity: 0.45;
      transform: rotate(1.5deg) scale(0.98);
    }

    .column-drag-over {
      background-color: rgba(59, 130, 246, 0.08) !important;
      box-shadow: inset 0 0 0 2px rgba(59, 130, 246, 0.55) !important;
    }

    .drop-indicator {
      height: 4px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      margin: 4px 0;
      transition: all 0.15s ease;
    }

    /* Animação sutil de entrada de modal e toasts */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-modal {
      animation: fadeSlideUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 flex flex-col h-screen select-none sm:select-auto">

  <!-- ==================== CABEÇALHO SUPERIOR ==================== -->
  <header class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 lg:px-6 py-3 flex flex-wrap items-center justify-between gap-3 z-30 shrink-0">
    <!-- Marca / Logotipo -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-blue-500/25 shrink-0">
        <!-- Ícone SVG moderno de produtividade / Kanban check -->
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"></rect>
          <path d="M8 7v10"></path>
          <path d="M12 7v6"></path>
          <path d="M16 7v8"></path>
          <path d="m14.5 16.5 1.5 1.5 3-3" stroke="#93c5fd"></path>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900 dark:text-white leading-tight">
            Em Dia <span class="hidden sm:inline font-medium text-slate-400 dark:text-slate-500">—</span> <span class="hidden sm:inline font-semibold text-blue-600 dark:text-blue-400">Gestão de Tarefas</span>
          </h1>
          <span id="total-tasks-badge" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 dark:bg-blue-950/70 dark:text-blue-300 border border-blue-200/70 dark:border-blue-800/60">
            0 tarefas
          </span>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 hidden md:block">Organize fluxos, prazos e prioridades em um quadro ágil</p>
      </div>
    </div>

    <!-- Barra de Busca, Filtros e Ações -->
    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end">
      <!-- Campo de Busca em Tempo Real -->
      <div class="relative flex-1 sm:flex-initial sm:w-64">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Buscar tarefa, tag ou descrição..."
          class="w-full pl-9 pr-8 py-1.5 text-sm rounded-xl bg-slate-100/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition placeholder:text-slate-400 dark:placeholder:text-slate-500"
        />
        <button
          id="clear-search-btn"
          title="Limpar busca"
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Filtro por Prioridade -->
      <select
        id="filter-priority"
        aria-label="Filtrar por prioridade"
        class="text-xs sm:text-sm py-1.5 px-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 cursor-pointer"
      >
        <option value="all">Todas prioridades</option>
        <option value="urgente">🔴 Urgente</option>
        <option value="alta">🟠 Alta</option>
        <option value="media">🔵 Média</option>
        <option value="baixa">🟢 Baixa</option>
      </select>

      <!-- Filtro por Etiqueta -->
      <select
        id="filter-tag"
        aria-label="Filtrar por etiqueta"
        class="text-xs sm:text-sm py-1.5 px-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/50 cursor-pointer"
      >
        <option value="all">Todas etiquetas</option>
      </select>

      <!-- Botão Alternar Tema Claro/Escuro -->
      <button
        id="theme-toggle-btn"
        title="Alternar tema Claro / Escuro"
        class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200/80 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition"
      >
        <!-- Ícone Sol (visível no Dark Mode) -->
        <svg id="icon-sun" class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <!-- Ícone Lua (visível no Light Mode) -->
        <svg id="icon-moon" class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>

      <!-- Menu Dropdown de Backup / Dados (Exportar, Importar, Restaurar) -->
      <div class="relative">
        <button
          id="data-menu-btn"
          title="Backup, Importação e Restauração"
          class="flex items-center gap-1.5 text-xs sm:text-sm font-medium py-1.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200/80 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition"
        >
          <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path>
          </svg>
          <span class="hidden sm:inline">Dados</span>
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <div
          id="data-dropdown"
          class="hidden absolute right-0 mt-2 w-56 rounded-2xl bg-white dark:bg-slate-900 shadow-xl border border-slate-200 dark:border-slate-700 py-1.5 z-50 animate-modal"
        >
          <div class="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-slate-400">
            Backup e Sincronização
          </div>
          <button id="export-json-btn" class="w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">
            <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar Backup (JSON)
          </button>
          <label for="import-json-input" class="w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition cursor-pointer">
            <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Importar Backup (JSON)
          </label>
          <input id="import-json-input" type="file" accept=".json,application/json" class="hidden" />
          <div class="my-1 border-t border-slate-100 dark:border-slate-800"></div>
          <button id="reset-demo-btn" class="w-full text-left px-3.5 py-2 text-sm flex items-center gap-2.5 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-rose-600 dark:text-rose-400 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Restaurar Exemplo Inicial
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Barra de aviso de filtro ativo (exibida apenas quando há busca ou filtro selecionado) -->
  <div id="active-filter-banner" class="hidden bg-blue-50/90 dark:bg-blue-950/50 border-b border-blue-200/70 dark:border-blue-900/60 px-4 lg:px-6 py-2 flex items-center justify-between text-xs text-blue-800 dark:text-blue-200 shrink-0">
    <div class="flex items-center gap-2">
      <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <span id="filter-summary-text">Exibindo tarefas filtradas</span>
    </div>
    <button id="reset-filters-btn" class="font-semibold underline hover:text-blue-600 dark:hover:text-blue-300">
      Limpar filtros
    </button>
  </div>

  <!-- ==================== ÁREA PRINCIPAL DO QUADRO KANBAN ==================== -->
  <main id="board-container" class="flex-1 overflow-x-auto overflow-y-hidden board-scroll p-4 lg:p-6 flex items-start gap-4 lg:gap-5">
    <!-- As colunas serão injetadas dinamicamente aqui via JavaScript -->
  </main>

  <!-- ==================== MODAL DE DETALHES / EDIÇÃO DO CARTÃO ==================== -->
  <div id="card-modal-backdrop" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden animate-modal my-auto">
      <!-- Cabeçalho do Modal -->
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between gap-3 bg-slate-50/70 dark:bg-slate-900/80">
        <div class="flex items-center gap-2 text-xs font-medium text-slate-500 dark:text-slate-400">
          <span class="px-2.5 py-1 rounded-lg bg-slate-200/70 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold" id="modal-column-badge">
            Coluna
          </span>
          <span>•</span>
          <span id="modal-created-date">Criado hoje</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="modal-duplicate-btn" title="Duplicar cartão" class="p-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-800 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button id="modal-delete-btn" title="Excluir cartão" class="p-2 rounded-xl text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <button id="modal-close-btn" title="Fechar" class="p-2 rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200/70 dark:hover:bg-slate-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Corpo do Modal -->
      <div class="p-5 sm:p-6 space-y-5 max-h-[78vh] overflow-y-auto column-scroll">
        <!-- Título da Tarefa -->
        <div>
          <label for="modal-title-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Título da Tarefa</label>
          <input
            id="modal-title-input"
            type="text"
            placeholder="Digite o título da tarefa..."
            class="w-full text-lg sm:text-xl font-bold px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white"
          />
        </div>

        <!-- Linha de Metadados: Status (Coluna), Prioridade e Data de Entrega -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
          <!-- Mover para Coluna (útil também no mobile/touch!) -->
          <div>
            <label for="modal-column-select" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Coluna / Status</label>
            <select
              id="modal-column-select"
              class="w-full text-sm px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100"
            ></select>
          </div>

          <!-- Prioridade -->
          <div>
            <label for="modal-priority-select" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Prioridade</label>
            <select
              id="modal-priority-select"
              class="w-full text-sm px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100"
            >
              <option value="baixa">🟢 Baixa</option>
              <option value="media">🔵 Média</option>
              <option value="alta">🟠 Alta</option>
              <option value="urgente">🔴 Urgente</option>
            </select>
          </div>

          <!-- Data de Entrega -->
          <div>
            <label for="modal-due-input" class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Data de Entrega</label>
            <input
              id="modal-due-input"
              type="date"
              class="w-full text-sm px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100"
            />
          </div>
        </div>

        <!-- Etiquetas / Tags Personalizáveis -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Etiquetas</label>
            <span class="text-[11px] text-slate-400">Clique para ativar ou crie uma nova</span>
          </div>
          <!-- Lista de tags selecionáveis -->
          <div id="modal-tags-list" class="flex flex-wrap gap-2 mb-2.5"></div>
          <!-- Adicionar nova etiqueta personalizada -->
          <div class="flex items-center gap-2">
            <input
              id="new-tag-name"
              type="text"
              maxlength="22"
              placeholder="Nova etiqueta (ex: Marketing)..."
              class="flex-1 text-xs sm:text-sm px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <select id="new-tag-color" class="text-xs sm:text-sm px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
              <option value="blue">Azul</option>
              <option value="emerald">Verde</option>
              <option value="violet">Roxo</option>
              <option value="amber">Âmbar</option>
              <option value="rose">Rosa</option>
              <option value="cyan">Ciano</option>
            </select>
            <button
              id="add-custom-tag-btn"
              type="button"
              class="text-xs sm:text-sm font-medium px-3 py-1.5 rounded-xl bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 transition"
            >
              + Criar
            </button>
          </div>
        </div>

        <!-- Descrição Detalhada -->
        <div>
          <label for="modal-desc-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Descrição</label>
          <textarea
            id="modal-desc-input"
            rows="3"
            placeholder="Adicione detalhes, links, critérios de aceite ou observações importantes..."
            class="w-full text-sm px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-slate-100 resize-y"
          ></textarea>
        </div>

        <!-- Checklist de Subtarefas -->
        <div class="bg-slate-50/90 dark:bg-slate-800/50 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100">Checklist de Subtarefas</h3>
            </div>
            <span id="modal-checklist-counter" class="text-xs font-semibold text-slate-500 dark:text-slate-400">0/0 (0%)</span>
          </div>

          <!-- Barra de Progresso -->
          <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden mb-3">
            <div id="modal-checklist-progress" class="h-full bg-gradient-to-r from-blue-500 to-emerald-500 transition-all duration-300" style="width: 0%"></div>
          </div>

          <!-- Itens do Checklist -->
          <div id="modal-checklist-items" class="space-y-2 mb-3"></div>

          <!-- Formulário para Novo Item do Checklist -->
          <div class="flex items-center gap-2">
            <input
              id="new-checklist-input"
              type="text"
              placeholder="Adicionar subtarefa e pressionar Enter..."
              class="flex-1 text-sm px-3 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              id="add-checklist-btn"
              type="button"
              class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition shrink-0"
            >
              Adicionar
            </button>
          </div>
        </div>
      </div>

      <!-- Rodapé do Modal -->
      <div class="px-5 py-3.5 border-t border-slate-100 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/80 flex items-center justify-end gap-2.5">

  <div id="confirm-modal-backdrop" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-[60] flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 max-w-md w-full rounded-2xl p-6 shadow-2xl animate-modal">
      <div class="flex items-start gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-rose-100 dark:bg-rose-950/70 text-rose-600 dark:text-rose-400 flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

  <!-- ==================== NOTIFICAÇÃO TOAST ==================== -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==================== LÓGICA DA APLICAÇÃO (ES6+) ==================== -->
  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'em_dia_kanban_state_v1';

      // Mapeamento visual das prioridades
      const PRIORITY_CONFIG = {
        baixa: {
          label: 'Baixa',
          badgeClass: 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800/60',
          dotClass: 'bg-emerald-500'
        },
        media: {
          label: 'Média',
          badgeClass: 'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-950/60 dark:text-blue-300 dark:border-blue-800/60',
          dotClass: 'bg-blue-500'
        },
        alta: {
          label: 'Alta',
          badgeClass: 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800/60',
          dotClass: 'bg-amber-500'
        },
        urgente: {
          label: 'Urgente',
          badgeClass: 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/60 dark:text-rose-300 dark:border-rose-800/60',
          dotClass: 'bg-rose-500'
        }
      };

      // Paleta de cores para etiquetas
      const TAG_COLORS = {
        blue: 'bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-200 border-blue-200/80 dark:border-blue-800',
        emerald: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-200 border-emerald-200/80 dark:border-emerald-800',
        violet: 'bg-violet-100 text-violet-800 dark:bg-violet-900/50 dark:text-violet-200 border-violet-200/80 dark:border-violet-800',
        amber: 'bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-200 border-amber-200/80 dark:border-amber-800',
        rose: 'bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-200 border-rose-200/80 dark:border-rose-800',
        cyan: 'bg-cyan-100 text-cyan-800 dark:bg-cyan-900/50 dark:text-cyan-200 border-cyan-200/80 dark:border-cyan-800'
      };

      // Utilitário de data relativa para dados iniciais realistas
      function getRelativeISODate(daysOffset) {
        const d = new Date();
        d.setDate(d.getDate() + daysOffset);
        return d.toISOString().split('T')[0];
      }

      // Dados iniciais padrão para demonstração imediata
      function createDefaultState() {
        return {
          theme: 'light',
          tags: [
            { id: 'tag-trabalho', name: 'Trabalho', color: 'blue' },
            { id: 'tag-design', name: 'Design', color: 'violet' },
            { id: 'tag-dev', name: 'Desenvolvimento', color: 'cyan' },
            { id: 'tag-financeiro', name: 'Financeiro', color: 'emerald' },
            { id: 'tag-pessoal', name: 'Pessoal', color: 'amber' },
            { id: 'tag-urgente', name: 'Urgente', color: 'rose' }
          ],
          columns: [
            {
              id: 'col-todo',
              title: 'A Fazer',
              color: 'bg-slate-400',
              cards: [
                {
                  id: 'card-101',
                  title: 'Planejar cronograma de entregas do trimestre',
                  description: 'Alinhar marcos principais com a equipe e definir metas semanais de acompanhamento no quadro.',
                  priority: 'alta',
                  tags: ['tag-trabalho'],
                  dueDate: getRelativeISODate(2),
                  createdAt: new Date().toLocaleDateString('pt-BR'),
                  checklist: [
                    { id: 'chk-1', text: 'Levantar prioridades de cada área', done: true },
                    { id: 'chk-2', text: 'Estimar prazos por sprint', done: false },
                    { id: 'chk-3', text: 'Validar calendário com stakeholders', done: false }
                  ]
                },
                {
                  id: 'card-102',
                  title: 'Organizar orçamento mensal e assinaturas',
                  description: 'Revisar ferramentas recorrentes, faturas e metas de economia pessoal.',
                  priority: 'media',
                  tags: ['tag-financeiro', 'tag-pessoal'],
                  dueDate: getRelativeISODate(5),
                  createdAt: new Date().toLocaleDateString('pt-BR'),
                  checklist: [
                    { id: 'chk-4', text: 'Exportar extrato bancário', done: true },
                    { id: 'chk-5', text: 'Cancelar serviços não utilizados', done: false }
                  ]
                }
              ]
            },
            {
              id: 'col-doing',
              title: 'Em Andamento',
              color: 'bg-blue-500',
              cards: [
                {
                  id: 'card-103',
                  title: 'Redesign da página inicial e sistema de cores',
                  description: 'Aplicar tipografia mais limpa, melhorar contraste no modo escuro e otimizar visualização mobile.',
                  priority: 'urgente',
                  tags: ['tag-design', 'tag-dev'],
                  dueDate: getRelativeISODate(0), // Vence hoje
                  createdAt: new Date().toLocaleDateString('pt-BR'),
                  checklist: [
                    { id: 'chk-6', text: 'Definir tokens de cores claras e escuras', done: true },
                    { id: 'chk-7', text: 'Prototipar cabeçalho responsivo', done: true },
                    { id: 'chk-8', text: 'Testar acessibilidade de contraste', done: false }
                  ]
                },
                {
                  id: 'card-104',
                  title: 'Configurar repositório no GitHub e backup JSON',
                  description: 'Publicar o código fonte do aplicativo Em Dia e testar exportação dos cartões.',
                  priority: 'alta',
                  tags: ['tag-dev', 'tag-trabalho'],
                  dueDate: getRelativeISODate(-1), // Atrasada para demonstrar alerta visual
                  createdAt: new Date().toLocaleDateString('pt-BR'),
                  checklist: []
                }
              ]
            },
            {
              id: 'col-review',
              title: 'Em Revisão',
              color: 'bg-amber-500',
              cards: [
                {
                  id: 'card-105',
                  title: 'Revisar proposta comercial para novo cliente',
                  description: 'Conferir escopo técnico, prazos de entrega e condições de pagamento antes do envio.',
                  priority: 'media',
                  tags: ['tag-trabalho', 'tag-financeiro'],
                  dueDate: getRelativeISODate(1),
                  createdAt: new Date().toLocaleDateString('pt-BR'),
                  checklist: [
                    { id: 'chk-9', text: 'Revisar valores e impostos', done: true },
                    { id: 'chk-10', text: 'Gerar PDF final assinado', done: true }
                  ]
                }
              ]
            },
            {
              id: 'col-done',
              title: 'Concluído',
              color: 'bg-emerald-500',
              cards: [
                {
                  id: 'card-106',
                  title: 'Estruturar quadro Kanban "Em Dia"',
                  description: 'Configuração inicial de colunas, filtros inteligentes e salvamento automático no navegador.',
                  priority: 'baixa',
                  tags: ['tag-dev'],
                  dueDate: getRelativeISODate(-2),
                  createdAt: new Date().toLocaleDateString('pt-BR'),
                  checklist: [
                    { id: 'chk-11', text: 'Criar colunas padrão', done: true },
                    { id: 'chk-12', text: 'Ativar persistência localStorage', done: true }
                  ]
                }
              ]
            }
          ]
        };
      }

      // Estado global da aplicação
      let state = loadState();
      let filters = {
        search: '',
        priority: 'all',
        tag: 'all'
      };

      // Estado temporário do modal de edição
      let editingContext = {
        columnId: null,
        cardId: null,
        draftCard: null
      };

      // Estado de Drag & Drop
      let dragState = {
        type: null, // 'card' ou 'column'
        cardId: null,
        sourceColId: null,
        sourceColIndex: null
      };

      // Carregar estado do localStorage
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultState();
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.columns)) return createDefaultState();
          return parsed;
        } catch (err) {
          console.error('Erro ao carregar dados do localStorage:', err);
          return createDefaultState();
        }
      }

      // Salvar estado no localStorage
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          showToast('Não foi possível salvar no navegador.', 'error');
        }
      }

      // Gerador de IDs únicos
      function uid(prefix = 'id') {
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
      }

      // Sanitização básica contra XSS em textos inseridos pelo usuário
      function escapeHTML(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Aplicar tema Claro / Escuro
      function applyTheme() {
        const html = document.documentElement;
        if (state.theme === 'dark') {
          html.classList.add('dark');
        } else {
          html.classList.remove('dark');
        }
      }

      // Exibir notificação Toast suave
      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = {
          info: 'bg-slate-900 dark:bg-slate-800 text-white border-slate-700',
          success: 'bg-emerald-600 text-white border-emerald-500',
          error: 'bg-rose-600 text-white border-rose-500'
        };
        toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg border text-sm font-medium flex items-center gap-2 animate-modal ${colors[type] || colors.info}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(6px)';
          toast.style.transition = 'all 0.2s ease';
          setTimeout(() => toast.remove(), 220);
        }, 2800);
      }

      // Modal de confirmação assíncrono (substitui window.confirm)
      function askConfirmation(title, message, confirmLabel = 'Confirmar') {
        return new Promise((resolve) => {
          const backdrop = document.getElementById('confirm-modal-backdrop');
          const titleEl = document.getElementById('confirm-modal-title');
          const msgEl = document.getElementById('confirm-modal-message');
          const okBtn = document.getElementById('confirm-ok-btn');
          const cancelBtn = document.getElementById('confirm-cancel-btn');

          titleEl.textContent = title;
          msgEl.textContent = message;
          okBtn.textContent = confirmLabel;
          backdrop.classList.remove('hidden');

          const cleanup = (result) => {
            backdrop.classList.add('hidden');
            okBtn.removeEventListener('click', onOk);
            cancelBtn.removeEventListener('click', onCancel);
            resolve(result);
          };

          const onOk = () => cleanup(true);
          const onCancel = () => cleanup(false);

          okBtn.addEventListener('click', onOk);
          cancelBtn.addEventListener('click', onCancel);
        });
      }

      // Análise de status da data de entrega (Atrasada, Vence Hoje, No Prazo)
      function getDueDateMeta(dueDateStr, isCompletedColumn = false) {
        if (!dueDateStr) return null;

        const [year, month, day] = dueDateStr.split('-').map(Number);
        const due = new Date(year, month - 1, day);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const diffDays = Math.round((due - today) / (1000 * 60 * 60 * 24));
        const formatted = due.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });

        if (isCompletedColumn) {
          return {
            text: formatted,
            statusLabel: 'Concluído',
            className: 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-800/60'
          };
        }

        if (diffDays < 0) {
          return {
            text: `${formatted} • Atrasada`,
            statusLabel: 'Atrasada',
            className: 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/60 dark:text-rose-300 dark:border-rose-800/70 font-semibold'
          };
        }
        if (diffDays === 0) {
          return {
            text: `${formatted} • Hoje`,
            statusLabel: 'Vence hoje',
            className: 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800/70 font-semibold'
          };
        }
        return {
          text: formatted,
          statusLabel: 'No prazo',
          className: 'bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700'
        };
      }

      // Atualiza opções do seletor de etiquetas no cabeçalho
      function renderHeaderTagFilter() {
        const select = document.getElementById('filter-tag');
        const current = filters.tag;
        select.innerHTML = `<option value="all">Todas etiquetas</option>`;
        state.tags.forEach(tag => {
          const opt = document.createElement('option');
          opt.value = tag.id;
          opt.textContent = `🏷️ ${tag.name}`;
          select.appendChild(opt);
        });
        select.value = state.tags.some(t => t.id === current) ? current : 'all';
      }

      // Verifica se um cartão passa pelos filtros atuais
      function cardMatchesFilters(card) {
        if (filters.priority !== 'all' && card.priority !== filters.priority) {
          return false;
        }
        if (filters.tag !== 'all' && !(card.tags || []).includes(filters.tag)) {
          return false;
        }
        if (filters.search.trim() !== '') {
          const q = filters.search.trim().toLowerCase();
          const titleMatch = (card.title || '').toLowerCase().includes(q);
          const descMatch = (card.description || '').toLowerCase().includes(q);
          const tagNames = (card.tags || [])
            .map(tid => state.tags.find(t => t.id === tid)?.name.toLowerCase() || '')
            .join(' ');
          const tagMatch = tagNames.includes(q);
          if (!titleMatch && !descMatch && !tagMatch) return false;
        }
        return true;
      }

      // Renderiza o quadro Kanban completo
      function renderBoard() {
        const board = document.getElementById('board-container');
        board.innerHTML = '';

        let totalCards = 0;
        let visibleCards = 0;

        const hasActiveFilter = filters.search.trim() !== '' || filters.priority !== 'all' || filters.tag !== 'all';

        state.columns.forEach((column, colIndex) => {
          totalCards += column.cards.length;
          const filteredCards = column.cards.filter(cardMatchesFilters);
          visibleCards += filteredCards.length;

          const isDoneColumn = column.title.toLowerCase().includes('conclu');

          // Container da Coluna
          const colEl = document.createElement('section');
          colEl.className = 'w-[300px] sm:w-[325px] shrink-0 bg-slate-200/70 dark:bg-slate-900/90 border border-slate-200/90 dark:border-slate-800 rounded-2xl flex flex-col max-h-full transition-all duration-150 shadow-xs';
          colEl.dataset.colId = column.id;
          colEl.dataset.colIndex = colIndex;

          // Cabeçalho da Coluna
          const headerEl = document.createElement('div');
          headerEl.className = 'p-3.5 pb-2.5 flex items-center justify-between gap-2 cursor-grab active:cursor-grabbing';
          headerEl.draggable = true;

          // Drag de Coluna para reordenar
          headerEl.addEventListener('dragstart', (e) => {
            if (e.target.closest('button') || e.target.closest('input')) return;
            dragState = { type: 'column', sourceColId: column.id, sourceColIndex: colIndex };
            colEl.classList.add('opacity-50');
            e.dataTransfer.effectAllowed = 'move';
          });
          headerEl.addEventListener('dragend', () => {
            colEl.classList.remove('opacity-50');
            dragState = { type: null, cardId: null, sourceColId: null, sourceColIndex: null };
          });

          headerEl.innerHTML = `
            <div class="flex items-center gap-2 min-w-0 flex-1">
              <span class="w-2.5 h-2.5 rounded-full ${column.color || 'bg-blue-500'} shrink-0"></span>
              <h2
                class="column-title-text font-bold text-sm text-slate-800 dark:text-slate-100 truncate cursor-pointer hover:text-blue-600 dark:hover:text-blue-400"
                title="Clique duplo para renomear"
              >${escapeHTML(column.title)}</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-white/90 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 shrink-0">
                ${hasActiveFilter ? `${filteredCards.length}/${column.cards.length}` : column.cards.length}
              </span>
            </div>
            <div class="relative flex items-center gap-0.5 shrink-0">
              <button class="col-move-left-btn p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-white/70 dark:hover:bg-slate-800 transition ${colIndex === 0 ? 'opacity-30 pointer-events-none' : ''}" title="Mover coluna para esquerda">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <button class="col-move-right-btn p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-white/70 dark:hover:bg-slate-800 transition ${colIndex === state.columns.length - 1 ? 'opacity-30 pointer-events-none' : ''}" title="Mover coluna para direita">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
              </button>
              <button class="col-menu-btn p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-white/70 dark:hover:bg-slate-800 transition" title="Opções da coluna">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
              </button>
              <div class="col-dropdown hidden absolute right-0 top-8 w-44 rounded-xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-20">
                <button class="col-rename-opt w-full text-left px-3 py-1.5 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center gap-2">
                  ✏️ Renomear coluna
                </button>
                <button class="col-delete-opt w-full text-left px-3 py-1.5 text-xs font-medium hover:bg-rose-50 dark:hover:bg-rose-950/50 text-rose-600 dark:text-rose-400 flex items-center gap-2">
                  🗑️ Excluir coluna
                </button>
              </div>
            </div>
          `;

          // Eventos de renomear (clique duplo ou menu) e mover/excluir coluna
          const titleEl = headerEl.querySelector('.column-title-text');
          const startRenameColumn = () => {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = column.title;
            input.className = 'w-full text-sm font-bold px-2 py-0.5 rounded-lg bg-white dark:bg-slate-800 border border-blue-500 text-slate-900 dark:text-white focus:outline-none';
            titleEl.replaceWith(input);
            input.focus();
            input.select();

            const commitRename = () => {
              const nextTitle = input.value.trim();
              if (nextTitle && nextTitle !== column.title) {
                column.title = nextTitle;
                saveState();
                showToast('Coluna renomeada.');
              }
              renderBoard();
            };

            input.addEventListener('blur', commitRename);
            input.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') commitRename();
              if (e.key === 'Escape') renderBoard();
            });
          };

          titleEl.addEventListener('dblclick', startRenameColumn);

          const menuBtn = headerEl.querySelector('.col-menu-btn');
          const dropdown = headerEl.querySelector('.col-dropdown');
          menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.col-dropdown').forEach(d => {
              if (d !== dropdown) d.classList.add('hidden');
            });
            dropdown.classList.toggle('hidden');
          });

          headerEl.querySelector('.col-rename-opt').addEventListener('click', () => {
            dropdown.classList.add('hidden');
            startRenameColumn();
          });

          headerEl.querySelector('.col-delete-opt').addEventListener('click', async () => {
            dropdown.classList.add('hidden');
            const confirmed = await askConfirmation(
              `Excluir coluna "${column.title}"?`,
              column.cards.length > 0
                ? `Esta coluna possui ${column.cards.length} tarefa(s) que também serão removidas permanentemente.`
                : 'Tem certeza que deseja excluir esta coluna vazia?',
              'Excluir Coluna'
            );
            if (confirmed) {
              state.columns = state.columns.filter(c => c.id !== column.id);
              saveState();
              renderBoard();
              showToast('Coluna excluída.');
            }
          });

          headerEl.querySelector('.col-move-left-btn').addEventListener('click', () => {
            if (colIndex > 0) {
              const temp = state.columns[colIndex - 1];
              state.columns[colIndex - 1] = state.columns[colIndex];
              state.columns[colIndex] = temp;
              saveState();
              renderBoard();
            }
          });

          headerEl.querySelector('.col-move-right-btn').addEventListener('click', () => {
            if (colIndex < state.columns.length - 1) {
              const temp = state.columns[colIndex + 1];
              state.columns[colIndex + 1] = state.columns[colIndex];
              state.columns[colIndex] = temp;
              saveState();
              renderBoard();
            }
          });

          // Lista de Cartões da Coluna
          const cardsListEl = document.createElement('div');
          cardsListEl.className = 'px-3 py-1 space-y-2.5 overflow-y-auto column-scroll flex-1 min-h-[60px]';
          cardsListEl.dataset.colId = column.id;

          if (filteredCards.length === 0) {
            const emptyHint = document.createElement('div');
            emptyHint.className = 'py-6 px-3 text-center border-2 border-dashed border-slate-300/80 dark:border-slate-800 rounded-xl text-xs text-slate-400 dark:text-slate-500';
            emptyHint.textContent = hasActiveFilter ? 'Nenhuma tarefa corresponde ao filtro' : 'Arraste cartões para cá ou clique abaixo para criar';
            cardsListEl.appendChild(emptyHint);
          } else {
            filteredCards.forEach((card) => {
              const cardEl = createCardElement(card, column.id, isDoneColumn);
              cardsListEl.appendChild(cardEl);
            });
          }

          // Eventos de Drag & Drop na Coluna (suporta mover cartões e reordenar colunas)
          colEl.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (dragState.type === 'card') {
              colEl.classList.add('column-drag-over');
              updateDropIndicator(cardsListEl, e.clientY);
            } else if (dragState.type === 'column' && dragState.sourceColId !== column.id) {
              colEl.classList.add('column-drag-over');
            }
          });

          colEl.addEventListener('dragleave', (e) => {
            if (!colEl.contains(e.relatedTarget)) {
              colEl.classList.remove('column-drag-over');
              removeDropIndicators(cardsListEl);
            }
          });

          colEl.addEventListener('drop', (e) => {
            e.preventDefault();
            colEl.classList.remove('column-drag-over');

            if (dragState.type === 'card' && dragState.cardId) {
              const targetIndex = getDropInsertIndex(cardsListEl, e.clientY);
              removeDropIndicators(cardsListEl);
              moveCard(dragState.sourceColId, dragState.cardId, column.id, targetIndex);
            } else if (dragState.type === 'column' && dragState.sourceColId && dragState.sourceColId !== column.id) {
              const fromIdx = state.columns.findIndex(c => c.id === dragState.sourceColId);
              const toIdx = state.columns.findIndex(c => c.id === column.id);
              if (fromIdx !== -1 && toIdx !== -1) {
                const [movedCol] = state.columns.splice(fromIdx, 1);
                state.columns.splice(toIdx, 0, movedCol);
                saveState();
                renderBoard();
              }
            }
          });

          // Rodapé da Coluna: Botão "+ Adicionar cartão" ou formulário inline rápido
          const footerEl = document.createElement('div');
          footerEl.className = 'p-3 pt-2';

          const addBtn = document.createElement('button');
          addBtn.className = 'w-full py-2 px-3 rounded-xl text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-white/80 dark:hover:bg-slate-800 flex items-center gap-2 transition';
          addBtn.innerHTML = `
            <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span>Adicionar cartão</span>
          `;

          addBtn.addEventListener('click', () => {
            showQuickAddCardForm(footerEl, column.id);
          });

          footerEl.appendChild(addBtn);

          colEl.appendChild(headerEl);
          colEl.appendChild(cardsListEl);
          colEl.appendChild(footerEl);
          board.appendChild(colEl);
        });

        // Botão "+ Adicionar outra coluna" ao final do quadro
        const addColumnWrapper = document.createElement('div');
        addColumnWrapper.className = 'w-[280px] sm:w-[300px] shrink-0';
        addColumnWrapper.innerHTML = `
          <button id="add-column-btn" class="w-full py-3.5 px-4 rounded-2xl bg-white/60 hover:bg-white dark:bg-slate-900/60 dark:hover:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 flex items-center justify-center gap-2 transition shadow-2xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span>Adicionar nova coluna</span>
          </button>
        `;
        addColumnWrapper.querySelector('#add-column-btn').addEventListener('click', () => {
          showQuickAddColumnForm(addColumnWrapper);
        });
        board.appendChild(addColumnWrapper);

        // Atualiza contadores e banner de filtros
        document.getElementById('total-tasks-badge').textContent =
          totalCards === 1 ? '1 tarefa' : `${totalCards} tarefas`;

        const banner = document.getElementById('active-filter-banner');
        if (hasActiveFilter) {
          banner.classList.remove('hidden');
          document.getElementById('filter-summary-text').textContent =
            `Filtro ativo: mostrando ${visibleCards} de ${totalCards} tarefa(s).`;
        } else {
          banner.classList.add('hidden');
        }
      }

      // Cria o elemento HTML de um cartão individual
      function createCardElement(card, columnId, isDoneColumn) {
        const cardEl = document.createElement('article');
        cardEl.className = 'kanban-card group bg-white dark:bg-slate-800/95 hover:bg-white dark:hover:bg-slate-800 border border-slate-200/90 dark:border-slate-700/80 rounded-xl p-3.5 shadow-card hover:shadow-card-hover transition-all duration-150 cursor-pointer relative';
        cardEl.draggable = true;
        cardEl.dataset.cardId = card.id;
        cardEl.dataset.colId = columnId;

        // Drag start / end do cartão
        cardEl.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          dragState = {
            type: 'card',
            cardId: card.id,
            sourceColId: columnId
          };
          cardEl.classList.add('card-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', card.id);
        });

        cardEl.addEventListener('dragend', () => {
          cardEl.classList.remove('card-dragging');
          document.querySelectorAll('.column-drag-over').forEach(el => el.classList.remove('column-drag-over'));
          document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
          dragState = { type: null, cardId: null, sourceColId: null, sourceColIndex: null };
        });

        // Abrir modal de detalhes ao clicar no cartão
        cardEl.addEventListener('click', () => {
          openCardModal(columnId, card.id);
        });

        // Etiquetas do cartão
        const tagsHTML = (card.tags || [])
          .map(tagId => state.tags.find(t => t.id === tagId))
          .filter(Boolean)
          .map(tag => {
            const colorClass = TAG_COLORS[tag.color] || TAG_COLORS.blue;
            return `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-md border ${colorClass}">${escapeHTML(tag.name)}</span>`;
          })
          .join('');

        // Badge de prioridade
        const prio = PRIORITY_CONFIG[card.priority] || PRIORITY_CONFIG.media;

        // Data de entrega
        const dueMeta = getDueDateMeta(card.dueDate, isDoneColumn);
        const dueHTML = dueMeta
          ? `<span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-md border ${dueMeta.className}">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${escapeHTML(dueMeta.text)}
            </span>`
          : '';

        // Progresso do checklist
        const checklist = card.checklist || [];
        const doneCount = checklist.filter(i => i.done).length;
        const totalChecklist = checklist.length;
        const pct = totalChecklist > 0 ? Math.round((doneCount / totalChecklist) * 100) : 0;

        const checklistHTML = totalChecklist > 0
          ? `
            <div class="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/70">
              <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 mb-1">
                <span class="inline-flex items-center gap-1 font-medium ${doneCount === totalChecklist ? 'text-emerald-600 dark:text-emerald-400' : ''}">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                  ${doneCount}/${totalChecklist}
                </span>
                <span>${pct}%</span>
              </div>
              <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                <div class="h-full ${doneCount === totalChecklist ? 'bg-emerald-500' : 'bg-blue-500'} transition-all duration-300" style="width: ${pct}%"></div>
              </div>
            </div>
          `
          : '';

        cardEl.innerHTML = `
          ${tagsHTML ? `<div class="flex flex-wrap gap-1.5 mb-2">${tagsHTML}</div>` : ''}
          <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
            ${escapeHTML(card.title)}
          </h3>
          ${card.description ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">${escapeHTML(card.description)}</p>` : ''}
          <div class="flex flex-wrap items-center gap-1.5 mt-3">
            <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold px-2 py-0.5 rounded-md border ${prio.badgeClass}">
              <span class="w-1.5 h-1.5 rounded-full ${prio.dotClass}"></span>
              ${prio.label}
            </span>
            ${dueHTML}
          </div>
          ${checklistHTML}
        `;

        return cardEl;
      }

      // Auxiliares de indicador visual de Drop dentro de uma coluna
      function removeDropIndicators(container) {
        container.querySelectorAll('.drop-indicator').forEach(el => el.remove());
      }

      function updateDropIndicator(container, mouseY) {
        removeDropIndicators(container);
        const cards = [...container.querySelectorAll('.kanban-card:not(.card-dragging)')];
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';

        const afterElement = cards.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = mouseY - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset, element: child };
          }
          return closest;
        }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;

        if (afterElement) {
          container.insertBefore(indicator, afterElement);
        } else {
          container.appendChild(indicator);
        }
      }

      function getDropInsertIndex(container, mouseY) {
        const cards = [...container.querySelectorAll('.kanban-card')];
        let insertIndex = cards.length;
        for (let i = 0; i < cards.length; i++) {
          const box = cards[i].getBoundingClientRect();
          if (mouseY < box.top + box.height / 2) {
            insertIndex = i;
            break;
          }
        }
        return insertIndex;
      }

      // Move um cartão entre colunas ou reordena na mesma coluna
      function moveCard(sourceColId, cardId, targetColId, targetIndex) {
        const sourceCol = state.columns.find(c => c.id === sourceColId);
        const targetCol = state.columns.find(c => c.id === targetColId);
        if (!sourceCol || !targetCol) return;

        const cardIndex = sourceCol.cards.findIndex(c => c.id === cardId);
        if (cardIndex === -1) return;

        const [movedCard] = sourceCol.cards.splice(cardIndex, 1);

        // Ajusta índice se estiver reordenando na mesma coluna para baixo
        let finalIndex = targetIndex;
        if (sourceColId === targetColId && cardIndex < targetIndex) {
          finalIndex = Math.max(0, targetIndex - 1);
        }

        targetCol.cards.splice(finalIndex, 0, movedCard);
        saveState();
        renderBoard();
      }

      // Formulário rápido inline para adicionar cartão na coluna

            ></textarea>
            <div class="flex items-center justify-between gap-2">
              <select class="quick-card-priority text-xs px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600">
                <option value="media">🔵 Média</option>
                <option value="baixa">🟢 Baixa</option>

                  Cancelar
                </button>
                <button type="button" class="quick-submit-btn px-3 py-1 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white">
                  Adicionar
                </button>
              </div>

        `;

        const textarea = footerEl.querySelector('.quick-card-input');
        const prioSelect = footerEl.querySelector('.quick-card-priority');
        textarea.focus();

        const submit = () => {
          const title = textarea.value.trim();
          if (!title) {
            renderBoard();

          }
          const col = state.columns.find(c => c.id === columnId);
          if (col) {
            col.cards.push({
              id: uid('card'),
              title,

              priority: prioSelect.value,
              tags: [],
              dueDate: '',

            });

        textarea.addEventListener('keydown', (e) => {

          }

        });

      // Formulário rápido para adicionar nova coluna
      function showQuickAddColumnForm(wrapper) {
        const dotColors = ['bg-blue-500', 'bg-violet-500', 'bg-emerald-500', 'bg-amber-500', 'bg-rose-500', 'bg-cyan-500'];

      // ==================== MODAL DE DETALHES DO CARTÃO ====================
      function openCardModal(columnId, cardId) {
        const col = state.columns.find(c => c.id === columnId);
        if (!col) return;
        const card = col.cards.find(c => c.id === cardId);
        if (!card) return;

        // Cria cópia profunda para edição segura antes de salvar
        editingContext = {
          columnId,
          cardId,
          draftCard: JSON.parse(JSON.stringify(card))
        };

        const draft = editingContext.draftCard;

        document.getElementById('modal-column-badge').textContent = col.title;
        document.getElementById('modal-created-date').textContent = `Criado em ${draft.createdAt || 'hoje'}`;
        document.getElementById('modal-title-input').value = draft.title;
        document.getElementById('modal-desc-input').value = draft.description || '';
        document.getElementById('modal-priority-select').value = draft.priority || 'media';
        document.getElementById('modal-due-input').value = draft.dueDate || '';

        // Popular seletor de colunas
        const colSelect = document.getElementById('modal-column-select');
        colSelect.innerHTML = '';
        state.columns.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.title;
          colSelect.appendChild(opt);
        });
        colSelect.value = columnId;

        renderModalTags();
        renderModalChecklist();

        document.getElementById('card-modal-backdrop').classList.remove('hidden');
      }

      function closeCardModal() {
        document.getElementById('card-modal-backdrop').classList.add('hidden');
        editingContext = { columnId: null, cardId: null, draftCard: null };
      }

      function renderModalTags() {
        const container = document.getElementById('modal-tags-list');
        container.innerHTML = '';
        const selectedTags = editingContext.draftCard.tags || [];

        state.tags.forEach(tag => {
          const isSelected = selectedTags.includes(tag.id);
          const colorClass = TAG_COLORS[tag.color] || TAG_COLORS.blue;

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `text-xs font-semibold px-3 py-1 rounded-lg border transition flex items-center gap-1.5 ${
            isSelected
              ? `${colorClass} ring-2 ring-blue-500/60 scale-[1.02]`
              : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700 opacity-75 hover:opacity-100'
          }`;
          btn.innerHTML = `
            <span>${isSelected ? '✓' : '+'}</span>
            <span>${escapeHTML(tag.name)}</span>
          `;
          btn.addEventListener('click', () => {
            if (isSelected) {
              editingContext.draftCard.tags = selectedTags.filter(id => id !== tag.id);
            } else {
              editingContext.draftCard.tags.push(tag.id);
            }
            renderModalTags();
          });
          container.appendChild(btn);
        });
      }

      function renderModalChecklist() {
        const listEl = document.getElementById('modal-checklist-items');
        const counterEl = document.getElementById('modal-checklist-counter');
        const progressEl = document.getElementById('modal-checklist-progress');

        const items = editingContext.draftCard.checklist || [];
        const doneCount = items.filter(i => i.done).length;
        const pct = items.length > 0 ? Math.round((doneCount / items.length) * 100) : 0;

        counterEl.textContent = `${doneCount}/${items.length} (${pct}%)`;
        progressEl.style.width = `${pct}%`;

        listEl.innerHTML = '';
        items.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between gap-2 bg-white dark:bg-slate-900 px-3 py-2 rounded-xl border border-slate-200/80 dark:border-slate-700/80';
          row.innerHTML = `
            <label class="flex items-center gap-2.5 flex-1 cursor-pointer min-w-0">
              <input type="checkbox" ${item.done ? 'checked' : ''} class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 cursor-pointer" />
              <span class="text-sm truncate ${item.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-200'}">
                ${escapeHTML(item.text)}
              </span>
            </label>
            <button type="button" title="Remover subtarefa" class="text-slate-400 hover:text-rose-500 p-1 rounded-lg transition">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          `;

          row.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
            item.done = e.target.checked;
            renderModalChecklist();
          });

          row.querySelector('button').addEventListener('click', () => {
            editingContext.draftCard.checklist.splice(idx, 1);
            renderModalChecklist();
          });

          listEl.appendChild(row);
        });
      }

      // Salvar alterações do modal
      function saveCardModalChanges() {
        const { columnId, cardId, draftCard } = editingContext;
        if (!draftCard) return;

        const nextTitle = document.getElementById('modal-title-input').value.trim();
        if (!nextTitle) {
          showToast('O título da tarefa não pode ficar vazio.', 'error');
          document.getElementById('modal-title-input').focus();
          return;
        }

        draftCard.title = nextTitle;
        draftCard.description = document.getElementById('modal-desc-input').value.trim();
        draftCard.priority = document.getElementById('modal-priority-select').value;
        draftCard.dueDate = document.getElementById('modal-due-input').value;

        const targetColId = document.getElementById('modal-column-select').value;
        const sourceCol = state.columns.find(c => c.id === columnId);
        const targetCol = state.columns.find(c => c.id === targetColId);

        if (sourceCol && targetCol) {
          const idx = sourceCol.cards.findIndex(c => c.id === cardId);
          if (idx !== -1) {
            if (sourceCol.id === targetCol.id) {
              sourceCol.cards[idx] = draftCard;
            } else {
              sourceCol.cards.splice(idx, 1);
              targetCol.cards.push(draftCard);
            }
          }
        }

        saveState();
        renderHeaderTagFilter();
        renderBoard();
        closeCardModal();
        showToast('Alterações salvas!', 'success');
      }

      // ==================== EXPORTAÇÃO, IMPORTAÇÃO E BACKUP ====================
      function exportBackupJSON() {
        const payload = {
          app: 'Em Dia - Gestão de Tarefas',
          exportedAt: new Date().toISOString(),
          data: state
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateTag = new Date().toISOString().split('T')[0];
        a.href = url;
        a.download = `em-dia-backup-${dateTag}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Backup JSON exportado com sucesso!', 'success');
      }

      function handleImportJSON(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            const importedState = parsed.data && Array.isArray(parsed.data.columns) ? parsed.data : parsed;
            if (!importedState || !Array.isArray(importedState.columns)) {
              throw new Error('Formato inválido');
            }
            state = importedState;
            if (!Array.isArray(state.tags)) state.tags = createDefaultState().tags;
            saveState();
            applyTheme();
            renderHeaderTagFilter();
            renderBoard();
            showToast('Backup importado com sucesso!', 'success');
          } catch (err) {
            showToast('Arquivo JSON inválido ou incompatível.', 'error');
          }
        };
        reader.readAsText(file);
      }

      // ==================== INICIALIZAÇÃO E LISTENERS GLOBAIS ====================
      function init() {
        applyTheme();
        renderHeaderTagFilter();
        renderBoard();

        // Busca em tempo real
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        searchInput.addEventListener('input', (e) => {
          filters.search = e.target.value;
          clearSearchBtn.classList.toggle('hidden', filters.search.length === 0);
          renderBoard();
        });

        clearSearchBtn.addEventListener('click', () => {
          filters.search = '';
          searchInput.value = '';
          clearSearchBtn.classList.add('hidden');
          renderBoard();
        });

        // Filtros de Prioridade e Etiqueta
        document.getElementById('filter-priority').addEventListener('change', (e) => {
          filters.priority = e.target.value;
          renderBoard();
        });

        document.getElementById('filter-tag').addEventListener('change', (e) => {
          filters.tag = e.target.value;
          renderBoard();
        });

        document.getElementById('reset-filters-btn').addEventListener('click', () => {
          filters = { search: '', priority: 'all', tag: 'all' };
          searchInput.value = '';
          clearSearchBtn.classList.add('hidden');
          document.getElementById('filter-priority').value = 'all';
          document.getElementById('filter-tag').value = 'all';
          renderBoard();
        });

        // Alternar Tema Claro / Escuro
        document.getElementById('theme-toggle-btn').addEventListener('click', () => {
          state.theme = state.theme === 'dark' ? 'light' : 'dark';
          applyTheme();
          saveState();
        });

        // Dropdown de Dados (Exportar / Importar / Restaurar)
        const dataBtn = document.getElementById('data-menu-btn');
        const dataDropdown = document.getElementById('data-dropdown');
        dataBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          dataDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', () => {
          dataDropdown.classList.add('hidden');
          document.querySelectorAll('.col-dropdown').forEach(d => d.classList.add('hidden'));
        });

        document.getElementById('export-json-btn').addEventListener('click', () => {
          dataDropdown.classList.add('hidden');
          exportBackupJSON();
        });

        const importInput = document.getElementById('import-json-input');
        importInput.addEventListener('change', (e) => {
          dataDropdown.classList.add('hidden');
          handleImportJSON(e.target.files[0]);
          importInput.value = '';
        });

        document.getElementById('reset-demo-btn').addEventListener('click', async () => {
          dataDropdown.classList.add('hidden');
          const ok = await askConfirmation(
            'Restaurar quadro de exemplo?',
            'Isso substituirá todas as suas colunas e tarefas atuais pelos dados iniciais de demonstração.',
            'Restaurar Exemplo'
          );
          if (ok) {
            const currentTheme = state.theme;
            state = createDefaultState();
            state.theme = currentTheme;
            saveState();
            renderHeaderTagFilter();
            renderBoard();
            showToast('Quadro restaurado para o exemplo inicial.');
          }
        });

        // Eventos do Modal de Cartão
        document.getElementById('modal-close-btn').addEventListener('click', closeCardModal);
        document.getElementById('modal-cancel-btn').addEventListener('click', closeCardModal);
        document.getElementById('modal-save-btn').addEventListener('click', saveCardModalChanges);

        document.getElementById('card-modal-backdrop').addEventListener('click', (e) => {
          if (e.target.id === 'card-modal-backdrop') closeCardModal();
        });

        // Criar nova etiqueta personalizada dentro do modal
        document.getElementById('add-custom-tag-btn').addEventListener('click', () => {
          const nameInput = document.getElementById('new-tag-name');
          const colorSelect = document.getElementById('new-tag-color');
          const name = nameInput.value.trim();
          if (!name) return;

          const existing = state.tags.find(t => t.name.toLowerCase() === name.toLowerCase());
          if (existing) {
            if (!editingContext.draftCard.tags.includes(existing.id)) {
              editingContext.draftCard.tags.push(existing.id);
            }
          } else {
            const newTag = { id: uid('tag'), name, color: colorSelect.value };
            state.tags.push(newTag);
            editingContext.draftCard.tags.push(newTag.id);
            saveState();
            renderHeaderTagFilter();
          }
          nameInput.value = '';
          renderModalTags();
        });

        // Adicionar subtarefa ao checklist
        const addChecklistItem = () => {
          const input = document.getElementById('new-checklist-input');
          const text = input.value.trim();
          if (!text) return;
          editingContext.draftCard.checklist.push({
            id: uid('chk'),
            text,
            done: false
          });
          input.value = '';
          renderModalChecklist();
        };

        document.getElementById('add-checklist-btn').addEventListener('click', addChecklistItem);
        document.getElementById('new-checklist-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            addChecklistItem();
          }
        });

        // Duplicar cartão
        document.getElementById('modal-duplicate-btn').addEventListener('click', () => {
          const { columnId, draftCard } = editingContext;
          const col = state.columns.find(c => c.id === columnId);
          if (!col || !draftCard) return;

          const copy = JSON.parse(JSON.stringify(draftCard));
          copy.id = uid('card');
          copy.title = `${copy.title} (Cópia)`;
          copy.createdAt = new Date().toLocaleDateString('pt-BR');

          col.cards.push(copy);
          saveState();
          renderBoard();
          closeCardModal();
          showToast('Cartão duplicado!', 'success');
        });

        // Excluir cartão
        document.getElementById('modal-delete-btn').addEventListener('click', async () => {
          const { columnId, cardId, draftCard } = editingContext;
          const confirmed = await askConfirmation(
            'Excluir esta tarefa?',
            `A tarefa "${draftCard.title}" será removida permanentemente do quadro.`,
            'Excluir Tarefa'
          );
          if (confirmed) {
            const col = state.columns.find(c => c.id === columnId);
            if (col) {
              col.cards = col.cards.filter(c => c.id !== cardId);
              saveState();
              renderBoard();
            }
            closeCardModal();
            showToast('Tarefa excluída.');
          }
        });

        // Fechar modal com ESC
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !document.getElementById('card-modal-backdrop').classList.contains('hidden')) {
            closeCardModal();
          }
        });
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
